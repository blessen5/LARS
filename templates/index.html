{% extends "base.html" %}

{% block content %}
    <h1>AI-Powered PC Builder</h1>
    <p>Get personalized PC build recommendations based on your budget and usage needs.</p>
    
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('index') }}">
        <div class="form-group">
            <label for="budget">Your Budget ($):</label>
            <input type="number" id="budget" name="budget" min="400" value="1000" required>
        </div>
        
        <div class="form-group">
            <label for="usage">Primary Usage:</label>
            <select id="usage" name="usage" required>
                <option value="programming">Programming/Development</option>
                <option value="office" selected>Office/General Use</option>
            </select>
        </div>
        
        <button type="submit">Get PC Build Recommendation</button>
    </form>
{% endblock %}
